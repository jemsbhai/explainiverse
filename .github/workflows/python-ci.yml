name: Python CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compatibility-latest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Require the advertised macOS ARM64 runner
        if: matrix.os == 'macos-15'
        run: >-
          python -c
          "import platform;
          assert platform.machine() == 'arm64', platform.machine();
          print('macOS ARM64 runner verified')"

      - name: Provision the XGBoost OpenMP runtime on macOS
        if: matrix.os == 'macos-15'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install libomp
          test -f "$(brew --prefix libomp)/lib/libomp.dylib"
          brew list --versions libomp

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install all package extras, tests, and tutorial runner dependencies
        run: >-
          python -m pip install
          --editable ".[all]"
          "pytest>=8,<9"
          "pytest-cov>=4.1,<8"
          "cryptography==50.0.0"
          "pywin32==311; sys_platform == 'win32'"
          "quantus>=0.6,<0.7"
          "grad-cam>=1.5.5,<2"
          "nbformat>=5.10,<6"
          "nbclient>=0.10,<1"
          "ipykernel>=6.29,<8"

      - name: Use PyTorch's single OpenMP runtime on macOS
        if: matrix.os == 'macos-15'
        run: |
          torch_lib_dir="$(python -c "from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / 'lib')")"
          test -f "$torch_lib_dir/libomp.dylib"
          echo "DYLD_LIBRARY_PATH=$torch_lib_dir" >> "$GITHUB_ENV"
          echo "using PyTorch OpenMP runtime: $torch_lib_dir/libomp.dylib"

      - name: Require every accuracy-reference dependency
        run: >-
          python -c
          "import captum, lime, quantus, shap, skimage, torch, xgboost;
          import pytorch_grad_cam;
          print('all accuracy-reference dependencies imported')"

      - name: Prove PyTorch and XGBoost OpenMP coexistence on macOS
        if: matrix.os == 'macos-15'
        run: >-
          python -c
          "import torch, xgboost;
          logits = torch.tensor([[1.0, -1.0]], requires_grad=True);
          loss = torch.nn.functional.cross_entropy(logits, torch.tensor([0]));
          loss.backward();
          assert torch.isfinite(loss);
          print('PyTorch-first OpenMP coexistence verified')"

      - name: Run all-extras tests
        run: python -m pytest --strict-config --strict-markers

      - name: Validate installed dependency graph
        run: python -m pip check

  minimum-direct-dependencies:
    name: Minimum direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/python310-min-direct.txt

      - name: Install the minimum supported direct dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --constraint .github/constraints/python310-min-direct.txt \
            --editable ".[all]" \
            "pytest>=8,<9" \
            "pytest-cov>=4.1,<8" \
            "cryptography==50.0.0" \
            "grad-cam>=1.5.5,<2" \
            "nbformat>=5.10,<6" \
            "nbclient>=0.10,<1" \
            "ipykernel>=6.29,<8"

      - name: Validate the minimum dependency graph
        run: python -m pip check

      - name: Audit the exact Quantus exclusion partition
        run: python scripts/validate_quantus_partition.py

      - name: Exercise the complete minimum-version runtime surface
        run: python -m pytest --strict-config --strict-markers -m "not quantus_reference"

      # Quantus 0.6 requires pandas>=1.5.3, while the supported runtime floor is
      # pandas 1.5.0. Official Quantus comparisons run in the all-extras jobs;
      # this job preserves the exact runtime floor and excludes only tests
      # carrying the registered quantus_reference marker.

  quantus-reference:
    name: Quantus reference parity (zero skips)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and official Quantus reference
        run: >-
          python -m pip install
          --editable ".[all]"
          "pytest>=8,<9"
          "quantus>=0.6,<0.7"
          "grad-cam>=1.5.5,<2"

      - name: Require Quantus and audit the exact reference partition
        run: |
          python -c "import quantus; print('required Quantus reference imported:', quantus.__version__)"
          python scripts/validate_quantus_partition.py

      - name: Run every reviewed official Quantus comparison with zero skips
        run: |
          mapfile -t quantus_tests < <(
            grep -Ev '^[[:space:]]*(#|$)' \
              .github/constraints/quantus-reference-tests.txt
          )
          test "${#quantus_tests[@]}" -eq 9
          python -m pytest --strict-config --strict-markers \
            -m quantus_reference \
            "${quantus_tests[@]}"

      - name: Validate the reference dependency graph
        run: python -m pip check

  base-install:
    name: Base distribution contract (without Torch/Captum extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install only the base distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .

      - name: Validate optional-dependency fallbacks and package discovery
        run: |
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('skimage'); assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('captum') is None"
          python scripts/verify_installed_package.py

  quality-and-package:
    name: Full extras, quality, and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POETRY_VERSION: "2.3.2"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Install all extras and development tools
        run: poetry sync --all-extras --with dev,tutorial --no-interaction

      - name: Require every accuracy-reference dependency
        run: >-
          poetry run python -c
          "import captum, lime, quantus, shap, skimage, torch, xgboost;
          import pytorch_grad_cam;
          print('all accuracy-reference dependencies imported')"

      - name: Execute deterministic offline tutorials
        run: poetry run python scripts/execute_tutorials.py

      - name: Run branch-aware coverage gate
        run: >-
          poetry run python -m pytest --strict-config --strict-markers
          --cov=explainiverse --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-fail-under=81

      - name: Enforce changed-line coverage on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          poetry run diff-cover coverage.xml
          --compare-branch "origin/$BASE_REF"
          --fail-under=80

      - name: Check Black formatting
        run: poetry run black --check src tests scripts

      - name: Check import ordering
        run: poetry run isort --check-only src tests scripts

      - name: Run mypy
        run: poetry run mypy src scripts

      - name: Enforce the blocked Python typing claim at source
        run: poetry run python scripts/audit_typing_readiness.py

      - name: Validate Poetry metadata and lock file
        run: poetry check --lock

      - name: Validate installed dependency graph
        run: poetry run python -m pip check

      - name: Build source and wheel distributions
        run: poetry build

      - name: Prove built archives do not claim PEP 561 support
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist_path=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          poetry run python scripts/audit_typing_readiness.py \
            --distribution "$wheel_path" \
            --distribution "$sdist_path"

      - name: Validate distribution metadata
        run: poetry run twine check dist/*

      - name: Smoke-test the built wheel with all runtime extras
        run: |
          python -m venv "$RUNNER_TEMP/explainiverse-wheel-smoke"
          "$RUNNER_TEMP/explainiverse-wheel-smoke/bin/python" -m pip install --upgrade pip
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          "$RUNNER_TEMP/explainiverse-wheel-smoke/bin/python" -m pip install "${wheel_path}[all]"
          "$RUNNER_TEMP/explainiverse-wheel-smoke/bin/python" scripts/verify_installed_package.py

      - name: Smoke-test the built source distribution as a consumer
        run: |
          python -m venv "$RUNNER_TEMP/explainiverse-sdist-smoke"
          "$RUNNER_TEMP/explainiverse-sdist-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/explainiverse-sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/explainiverse-sdist-smoke/bin/python" scripts/verify_installed_package.py
