name: Artifact reproducibility

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: artifact-reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-build:
    name: Independent artifact build (${{ matrix.build-id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build-id: [one, two]
    env:
      BOOTSTRAP_PIP_VERSION: "26.2.1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/release-tools.txt

      - name: Pin and record the bootstrap installer
        run: |
          python -m pip install --upgrade "pip==$BOOTSTRAP_PIP_VERSION"
          python -m pip --version

      - name: Install the hash-locked Linux release-tool graph
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement .github/requirements/release-tools.txt

      - name: Record runner image and tool identities
        env:
          REPRODUCIBILITY_BUILD_ID: ${{ matrix.build-id }}
          REPRODUCIBILITY_JOB_INDEX: ${{ strategy.job-index }}
          REPRODUCIBILITY_JOB_TOTAL: ${{ strategy.job-total }}
          REPRODUCIBILITY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          python scripts/record_release_environment.py
          --requirements .github/requirements/release-tools.txt
          --build-identity "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$REPRODUCIBILITY_BUILD_ID"
          --output provenance/release-environment.json

      - name: Build with the commit timestamp as the reproducibility epoch
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export PYTHONHASHSEED=0
          poetry build --output dist
          python -m twine check dist/*

      - name: Upload independent build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-${{ matrix.build-id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            provenance/release-environment.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Artifact byte reproducibility
    needs: independent-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout comparison code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download first clean build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reproducibility-one
          path: independent/one

      - name: Download second clean build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reproducibility-two
          path: independent/two

      - name: Stage complete independent manifests
        run: |
          mkdir -p provenance
          cp independent/one/provenance/release-environment.json \
            provenance/release-environment-one.json
          cp independent/two/provenance/release-environment.json \
            provenance/release-environment-two.json

      - name: Require stable hosted-runner environment identity
        if: always()
        run: |
          python scripts/record_release_environment.py \
            --compare \
              independent/one/provenance/release-environment.json \
              independent/two/provenance/release-environment.json \
            --output provenance/release-environment-comparison.json

      - name: Require byte-identical wheel and source distribution
        if: always()
        run: |
          python scripts/compare_distribution_artifacts.py \
            independent/one/dist independent/two/dist \
            --report provenance/reproducibility.json

      - name: Archive reproducibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-report
          path: provenance/*
          if-no-files-found: error
          retention-days: 90
