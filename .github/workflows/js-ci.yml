name: JS Package CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: js-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/js

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.11.0, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke-test the packed tarball as a consumer
        shell: bash
        run: |
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/explainiverse-pack.json"
          tarball="$(node -e "const fs = require('fs'); const result = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(result[0].filename);" "$RUNNER_TEMP/explainiverse-pack.json")"
          consumer_dir="$RUNNER_TEMP/explainiverse-js-consumer"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/$tarball"
          node - <<'NODE'
          const root = require('explainiverse-js-experimental');
          const core = require('explainiverse-js-experimental/core');
          const visualizer = require('explainiverse-js-experimental/visualizer');

          for (const [entryPoint, exports] of Object.entries({ root, core, visualizer })) {
            if (Object.keys(exports).length === 0) {
              throw new Error(`${entryPoint} entry point has no runtime exports`);
            }
          }

          for (const [name, value] of Object.entries({
            Explanation: root.Explanation,
            BaseExplainer: core.BaseExplainer,
            ExplainerRegistry: core.ExplainerRegistry,
            ExplanationVisualizer: visualizer.ExplanationVisualizer,
          })) {
            if (typeof value !== 'function') {
              throw new Error(`${name} is not a function in the packed consumer install`);
            }
          }
          NODE

  react-peer-floor:
    name: React 18 peer floor (Node.js 20.11.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/js

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.11.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.11.0
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Build the private package tarball
        run: |
          npm ci
          npm run build
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/explainiverse-pack.json"

      - name: Exercise the declared React peer floor in a clean consumer
        shell: bash
        run: |
          tarball="$(node -e "const fs = require('fs'); const result = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(result[0].filename);" "$RUNNER_TEMP/explainiverse-pack.json")"
          consumer_dir="$RUNNER_TEMP/explainiverse-react18-consumer"
          mkdir -p "$consumer_dir"
          cd "$consumer_dir"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund \
            react@18.0.0 react-dom@18.0.0 "$RUNNER_TEMP/$tarball"
          node - <<'NODE'
          const React = require('react');
          const installedReactVersion = require('react/package.json').version;
          const { renderToStaticMarkup } = require('react-dom/server');
          const { Explanation } = require('explainiverse-js-experimental/core');
          const { ExplanationVisualizer } = require('explainiverse-js-experimental/visualizer');

          if (installedReactVersion !== '18.0.0') {
            throw new Error(`expected the declared React floor, received ${installedReactVersion}`);
          }
          const explanation = new Explanation('PeerFloor', 'accepted', {
            feature_attributions: { evidence: 1 },
          });
          const markup = renderToStaticMarkup(
            React.createElement(ExplanationVisualizer, { explanation }),
          );
          if (!markup.includes('Experimental Attribution View') || !markup.includes('evidence')) {
            throw new Error('React 18 peer-floor render omitted the expected visualizer content');
          }
          NODE

  real-browser-demo:
    name: Real-browser demo and automated accessibility (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/js

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 20.11.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.11.0
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install the locked Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and exercise the production demo in real browsers
        run: npm run test:browser

      - name: Preserve browser failures, traces, and accessibility output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-demo-evidence
          path: |
            packages/js/playwright-report
            packages/js/test-results
          if-no-files-found: ignore
          retention-days: 30
