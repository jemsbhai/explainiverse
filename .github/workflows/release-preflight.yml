name: Snapshot mutable controls before a stable tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Planned stable tag, which must not exist yet (for example v0.15.0)"
        required: true
        type: string
      release_commit:
        description: "Exact 40-character main commit SHA that will be tagged"
        required: true
        type: string
      cuda_run_id:
        description: "Successful all-edge cuda-ci workflow_dispatch run on release_commit"
        required: true
        type: string
      admin_snapshot_base64:
        description: "Fresh base64 capture made locally with an approved administrator gh token"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-preflight-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify external release controls without OIDC authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Validate a pre-tag dispatch from the exact main commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-commit must be a complete lowercase commit SHA" >&2
            exit 1
          fi
          if [[ ! "$CUDA_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "cuda_run_id must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "GITHUB_RUN_ATTEMPT must be a positive integer" >&2
            exit 1
          fi
          if [[ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ]]; then
            echo "the workflow actor and triggering actor must be identical" >&2
            exit 1
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"

      - name: Check out the exact reviewed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Query every attempt and page of exact-commit CUDA evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
        run: |
          mkdir -p release-preflight
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID" \
            > release-preflight/cuda-run.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[]' \
            | jq -s \
              '{query_filter:"all",pagination_complete:true,jobs:.}' \
              > release-preflight/cuda-jobs.json
          (cd release-preflight && sha256sum cuda-run.json cuda-jobs.json \
            > cuda-evidence.sha256)

      - name: Decode the fresh administrator-authenticated capture
        env:
          ADMIN_SNAPSHOT_BASE64: ${{ inputs.admin_snapshot_base64 }}
        run: |
          mkdir -p release-preflight
          printf '%s' "$ADMIN_SNAPSHOT_BASE64" | base64 --decode \
            > release-preflight/admin-capture.json
          (cd release-preflight && sha256sum admin-capture.json \
            > admin-capture.json.sha256)

      - name: Enforce policy, freshness, principal, commit, and tag binding
        id: bind
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
        run: |
          python scripts/release_external_controls.py bind \
            --policy .github/release-control-policy.json \
            --snapshot release-preflight/admin-capture.json \
            --output release-preflight/external-controls.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --cuda-run-json release-preflight/cuda-run.json \
            --cuda-jobs-json release-preflight/cuda-jobs.json \
            --cuda-run-id "$CUDA_RUN_ID"

      - name: Archive the control snapshot even when policy verification fails
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-preflight
          path: release-preflight/*
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest the accepted fixed pre-tag snapshot
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download and verify only the exact low-authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact-digest }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "artifact id must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "artifact digest must be 64 lowercase hexadecimal characters" >&2
            exit 1
          fi

          artifact_metadata="$RUNNER_TEMP/release-control-preflight-$ARTIFACT_ID.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            > "$artifact_metadata"
          jq -e --argjson id "$ARTIFACT_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg head "$GITHUB_SHA" --arg name release-control-preflight \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            '.id == $id and .name == $name and .expired == false and \
             .workflow_run.id == $run and .workflow_run.head_sha == $head and \
             .digest == $digest' "$artifact_metadata" > /dev/null

          artifact_archive="$RUNNER_TEMP/release-control-preflight-$ARTIFACT_ID.zip"
          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$artifact_archive" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          actual_artifact_digest=$(sha256sum "$artifact_archive")
          actual_artifact_digest=${actual_artifact_digest%% *}
          test "$actual_artifact_digest" = "$ARTIFACT_DIGEST"

          expected=$(printf '%s\n' \
            admin-capture.json \
            admin-capture.json.sha256 \
            cuda-evidence.sha256 \
            cuda-jobs.json \
            cuda-run.json \
            external-controls.json \
            external-controls.json.sha256 | sort)
          archive_entries=$(unzip -Z1 "$artifact_archive" | sort)
          test "$archive_entries" = "$expected"
          mkdir release-preflight
          unzip -q "$artifact_archive" -d release-preflight
          rm "$artifact_archive"

          actual=$(find release-preflight -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort)
          test "$actual" = "$expected"
          test -z "$(find release-preflight -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)"

          grep -Ex '[0-9a-f]{64}  admin-capture\.json' \
            release-preflight/admin-capture.json.sha256
          test "$(wc -l < release-preflight/admin-capture.json.sha256)" -eq 1
          grep -Ex '[0-9a-f]{64}  cuda-run\.json' \
            release-preflight/cuda-evidence.sha256
          grep -Ex '[0-9a-f]{64}  cuda-jobs\.json' \
            release-preflight/cuda-evidence.sha256
          test "$(wc -l < release-preflight/cuda-evidence.sha256)" -eq 2
          grep -Ex '[0-9a-f]{64}  external-controls\.json' \
            release-preflight/external-controls.json.sha256
          test "$(wc -l < release-preflight/external-controls.json.sha256)" -eq 1
          (cd release-preflight && \
            sha256sum --check admin-capture.json.sha256 && \
            sha256sum --check cuda-evidence.sha256 && \
            sha256sum --check external-controls.json.sha256)

      - name: Attest the accepted pre-tag control snapshot
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-preflight/admin-capture.json
            release-preflight/admin-capture.json.sha256
            release-preflight/cuda-run.json
            release-preflight/cuda-jobs.json
            release-preflight/cuda-evidence.sha256
            release-preflight/external-controls.json
            release-preflight/external-controls.json.sha256
