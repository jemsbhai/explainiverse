name: Snapshot mutable controls before a stable tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Planned stable tag, which must not exist yet (for example v1.2.3)"
        required: true
        type: string
      release_commit:
        description: "Exact 40-character main commit SHA that will be tagged"
        required: true
        type: string
      cuda_run_id:
        description: "Successful all-edge cuda-ci workflow_dispatch run; mutually exclusive with cuda_exception_id"
        required: false
        default: ""
        type: string
      cuda_exception_id:
        description: "Exact reviewed CPU-only exception; mutually exclusive with cuda_run_id"
        required: false
        default: ""
        type: string
      admin_snapshot_base64:
        description: "Fresh base64 capture made locally with an approved administrator gh token"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-preflight-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Verify and attest external release controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Validate a pre-tag dispatch from the exact main commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
          CUDA_EXCEPTION_ID: ${{ inputs.cuda_exception_id }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-commit must be a complete lowercase commit SHA" >&2
            exit 1
          fi
          if [[ -n "$CUDA_RUN_ID" && -n "$CUDA_EXCEPTION_ID" ]] || \
             [[ -z "$CUDA_RUN_ID" && -z "$CUDA_EXCEPTION_ID" ]]; then
            echo "supply exactly one of cuda_run_id or cuda_exception_id" >&2
            exit 1
          fi
          if [[ -n "$CUDA_RUN_ID" && ! "$CUDA_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "cuda_run_id must be a positive integer when supplied" >&2
            exit 1
          fi
          if [[ -n "$CUDA_EXCEPTION_ID" ]]; then
            if [[ "$CUDA_EXCEPTION_ID" != "EXPLAINIVERSE-v0.15.1-CPU-ONLY" ]]; then
              echo "cuda_exception_id is not the exact reviewed exception" >&2
              exit 1
            fi
            if [[ "$RELEASE_TAG" != "v0.15.1" ]]; then
              echo "the CPU-only CUDA exception is valid only for v0.15.1" >&2
              exit 1
            fi
          fi
          if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "GITHUB_RUN_ATTEMPT must be a positive integer" >&2
            exit 1
          fi
          if [[ "$GITHUB_ACTOR" != "$GITHUB_TRIGGERING_ACTOR" ]]; then
            echo "the workflow actor and triggering actor must be identical" >&2
            exit 1
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"

      - name: Check out the exact reviewed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Query every attempt and page of exact-commit CUDA evidence
        if: inputs.cuda_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
        run: |
          mkdir -p release-preflight
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID" \
            > release-preflight/cuda-run.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[]' \
            | jq -s \
              '{query_filter:"all",pagination_complete:true,jobs:.}' \
              > release-preflight/cuda-jobs.json
          (cd release-preflight && sha256sum cuda-run.json cuda-jobs.json \
            > cuda-evidence.sha256)

      - name: Decode the fresh administrator-authenticated capture
        env:
          ADMIN_SNAPSHOT_BASE64: ${{ inputs.admin_snapshot_base64 }}
        run: |
          mkdir -p release-preflight
          printf '%s' "$ADMIN_SNAPSHOT_BASE64" | base64 --decode \
            > release-preflight/admin-capture.json
          (cd release-preflight && sha256sum admin-capture.json \
            > admin-capture.json.sha256)

      - name: Enforce policy, freshness, principal, commit, and tag binding
        id: bind
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
          CUDA_EXCEPTION_ID: ${{ inputs.cuda_exception_id }}
        run: |
          cuda_selector=()
          if [[ -n "$CUDA_RUN_ID" ]]; then
            cuda_selector=(
              --cuda-run-json release-preflight/cuda-run.json
              --cuda-jobs-json release-preflight/cuda-jobs.json
              --cuda-run-id "$CUDA_RUN_ID"
            )
          else
            cuda_selector=(--cuda-exception-id "$CUDA_EXCEPTION_ID")
          fi
          python scripts/release_external_controls.py bind \
            --policy .github/release-control-policy.json \
            --snapshot release-preflight/admin-capture.json \
            --output release-preflight/external-controls.json \
            --cuda-gate-output release-preflight/cuda-release-gate.json \
            --github-output "$GITHUB_OUTPUT" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            "${cuda_selector[@]}"

      - name: Disclose the CPU-only release exception in the run summary
        if: steps.bind.outputs.cuda_mode == 'cpu_only_exception'
        env:
          CUDA_EXCEPTION_ID: ${{ steps.bind.outputs.cuda_exception_id }}
        run: |
          {
            echo "## CUDA release status: NOT RUN"
            echo
            echo "Exception \`$CUDA_EXCEPTION_ID\` applies only to v0.15.1."
            echo "This preflight does not claim CUDA or multi-GPU validation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the accepted pre-tag control snapshot
        if: steps.bind.outcome == 'success'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-preflight/*

      - name: Archive the control snapshot even when policy verification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control-preflight
          path: release-preflight/*
          if-no-files-found: error
          retention-days: 90
