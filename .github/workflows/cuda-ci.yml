name: CUDA release contracts

on:
  workflow_dispatch:
    inputs:
      single_minimum_runner_nonce:
        description: "16-hex binding for the minimum single-GPU custom runner"
        required: true
        type: string
      single_latest_runner_nonce:
        description: "16-hex binding for the latest single-GPU custom runner"
        required: true
        type: string
      two_minimum_runner_nonce:
        description: "16-hex binding for the minimum two-GPU custom runner"
        required: true
        type: string
      two_latest_runner_nonce:
        description: "16-hex binding for the latest two-GPU custom runner"
        required: true
        type: string
  schedule:
    - cron: "41 4 * * 3"
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cuda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cuda-runner-routing:
    name: Require approved CUDA runner routing
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Reject untrusted CUDA runner execution contexts
        env:
          SINGLE_MINIMUM_RUNNER_NONCE: ${{ inputs.single_minimum_runner_nonce }}
          SINGLE_LATEST_RUNNER_NONCE: ${{ inputs.single_latest_runner_nonce }}
          TWO_MINIMUM_RUNNER_NONCE: ${{ inputs.two_minimum_runner_nonce }}
          TWO_LATEST_RUNNER_NONCE: ${{ inputs.two_latest_runner_nonce }}
        run: |
          python3 - <<'PY'
          import os
          import re

          repository = os.environ.get("GITHUB_REPOSITORY")
          repository_owner = os.environ.get("GITHUB_REPOSITORY_OWNER")
          actor = os.environ.get("GITHUB_ACTOR")
          triggering_actor = os.environ.get("GITHUB_TRIGGERING_ACTOR")
          event_name = os.environ.get("GITHUB_EVENT_NAME")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT")
          runner_nonces = (
              os.environ.get("SINGLE_MINIMUM_RUNNER_NONCE"),
              os.environ.get("SINGLE_LATEST_RUNNER_NONCE"),
              os.environ.get("TWO_MINIMUM_RUNNER_NONCE"),
              os.environ.get("TWO_LATEST_RUNNER_NONCE"),
          )

          trusted_repository = (
              repository == "jemsbhai/explainiverse"
              and repository_owner == "jemsbhai"
          )
          trusted_trigger = (
              actor == repository_owner
              and triggering_actor == repository_owner
          )
          approved_event = event_name == "workflow_dispatch"
          exact_nonces = all(
              isinstance(value, str)
              and re.fullmatch(r"[a-f0-9]{16}", value) is not None
              for value in runner_nonces
          )
          distinct_nonces = len(set(runner_nonces)) == len(runner_nonces)
          first_attempt = run_attempt == "1"
          if not (
              trusted_repository
              and trusted_trigger
              and approved_event
              and exact_nonces
              and distinct_nonces
              and first_attempt
          ):
              raise SystemExit(
                  "custom CUDA runners require an owner-triggered first-attempt "
                  "dispatch with four distinct reviewed runner nonces"
              )
          PY

  single-gpu:
    name: CUDA single-GPU (Torch ${{ matrix.torch-edge }})
    needs: cuda-runner-routing
    if: ${{ always() }}
    # A rejected prerequisite or partial rerun selects only the hosted failure
    # reporter below; accepted work can run only on the reviewed custom GPU label.
    runs-on: >-
      ${{ github.run_attempt == 1 &&
      needs.cuda-runner-routing.result == 'success' &&
      format('explainiverse-cuda-single-jit-{0}', matrix.runner_nonce) ||
      'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-edge: minimum
            python-version: "3.10"
            constraints: .github/constraints/captum-min.txt
            runner_nonce: ${{ inputs.single_minimum_runner_nonce }}
          - torch-edge: latest
            python-version: "3.12"
            constraints: none
            runner_nonce: ${{ inputs.single_latest_runner_nonce }}
    env:
      EXPLAINIVERSE_REQUIRED_CUDA_DEVICES: "1"
      EXPLAINIVERSE_ENFORCE_CUDA_MANIFEST: "1"
      CUDA_VISIBLE_DEVICES: "0"

    steps:
      - name: Fail the required check when CUDA routing is rejected
        if: github.run_attempt != 1 || needs.cuda-runner-routing.result != 'success'
        run: |
          echo "approved single-GPU runner routing is unavailable" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require Linux GPU runner OS
        run: test "$RUNNER_OS" = Linux

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/captum-min.txt

      - name: Install the supported Torch edge
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          constraint_args=()
          if [[ "$CONSTRAINTS" != none ]]; then
            constraint_args=(--constraint "$CONSTRAINTS")
          fi
          python -m pip install --upgrade --upgrade-strategy eager \
            "${constraint_args[@]}" --editable ".[all]" "pytest>=8,<9"
          python -m pip check

      - name: Prove real driver, runtime, and device visibility
        run: |
          nvidia-smi
          python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0)); assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1"

      - name: Run every CUDA contract with zero skips
        run: python -m pytest --strict-config --strict-markers tests_cuda/test_cuda_release.py

  two-gpu:
    name: CUDA two-GPU scheduled (Torch ${{ matrix.torch-edge }})
    needs: cuda-runner-routing
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # A rejected prerequisite or partial rerun selects only the hosted failure
    # reporter below; accepted work can run only on the reviewed custom GPU label.
    runs-on: >-
      ${{ github.run_attempt == 1 &&
      needs.cuda-runner-routing.result == 'success' &&
      format('explainiverse-cuda-two-jit-{0}', matrix.runner_nonce) ||
      'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-edge: minimum
            python-version: "3.10"
            constraints: .github/constraints/captum-min.txt
            runner_nonce: ${{ inputs.two_minimum_runner_nonce }}
          - torch-edge: latest
            python-version: "3.12"
            constraints: none
            runner_nonce: ${{ inputs.two_latest_runner_nonce }}
    env:
      EXPLAINIVERSE_REQUIRED_CUDA_DEVICES: "2"
      EXPLAINIVERSE_ENFORCE_CUDA_MANIFEST: "1"
      CUDA_VISIBLE_DEVICES: "0,1"

    steps:
      - name: Fail the required check when CUDA routing is rejected
        if: github.run_attempt != 1 || needs.cuda-runner-routing.result != 'success'
        run: |
          echo "approved two-GPU runner routing is unavailable" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require Linux GPU runner OS
        run: test "$RUNNER_OS" = Linux

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/captum-min.txt

      - name: Install the supported Torch edge
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          constraint_args=()
          if [[ "$CONSTRAINTS" != none ]]; then
            constraint_args=(--constraint "$CONSTRAINTS")
          fi
          python -m pip install --upgrade --upgrade-strategy eager \
            "${constraint_args[@]}" --editable ".[all]" "pytest>=8,<9"
          python -m pip check

      - name: Prove two real visible CUDA devices
        run: |
          nvidia-smi
          python -c "import torch; print(torch.__version__, torch.version.cuda, [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]); assert torch.cuda.is_available(); assert torch.cuda.device_count() == 2"

      - name: Run every CUDA contract with zero skips
        run: python -m pytest --strict-config --strict-markers tests_cuda/test_cuda_release.py
