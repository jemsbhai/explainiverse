name: CUDA release contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  single-gpu:
    name: CUDA single-GPU (Torch ${{ matrix.torch-edge }})
    # Set this repository variable to a GitHub-managed or isolated ephemeral
    # CUDA runner label. The safe hosted default fails the hardware assertion
    # instead of silently skipping when external GPU capacity is unconfigured.
    runs-on: ${{ vars.CUDA_SINGLE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-edge: minimum
            python-version: "3.10"
            constraints: .github/constraints/captum-min.txt
          - torch-edge: latest
            python-version: "3.12"
            constraints: none
    env:
      EXPLAINIVERSE_REQUIRED_CUDA_DEVICES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/captum-min.txt

      - name: Install the supported Torch edge
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          constraint_args=()
          if [[ "$CONSTRAINTS" != none ]]; then
            constraint_args=(--constraint "$CONSTRAINTS")
          fi
          python -m pip install --upgrade --upgrade-strategy eager \
            "${constraint_args[@]}" --editable ".[all]" "pytest>=8,<9"
          python -m pip check

      - name: Prove real driver, runtime, and device visibility
        run: |
          nvidia-smi
          python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0)); assert torch.cuda.is_available(); assert torch.cuda.device_count() >= 1"

      - name: Run every CUDA contract with zero skips
        run: python -m pytest --strict-config --strict-markers tests_cuda/test_cuda_release.py

  two-gpu:
    name: CUDA two-GPU scheduled (Torch ${{ matrix.torch-edge }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The scheduled lane remains visibly red until two-GPU capacity is wired.
    runs-on: ${{ vars.CUDA_TWO_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-edge: minimum
            python-version: "3.10"
            constraints: .github/constraints/captum-min.txt
          - torch-edge: latest
            python-version: "3.12"
            constraints: none
    env:
      EXPLAINIVERSE_REQUIRED_CUDA_DEVICES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/captum-min.txt

      - name: Install the supported Torch edge
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          constraint_args=()
          if [[ "$CONSTRAINTS" != none ]]; then
            constraint_args=(--constraint "$CONSTRAINTS")
          fi
          python -m pip install --upgrade --upgrade-strategy eager \
            "${constraint_args[@]}" --editable ".[all]" "pytest>=8,<9"
          python -m pip check

      - name: Prove two real visible CUDA devices
        run: |
          nvidia-smi
          python -c "import torch; print(torch.__version__, torch.version.cuda, [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]); assert torch.cuda.is_available(); assert torch.cuda.device_count() >= 2"

      - name: Run every CUDA contract with zero skips
        run: python -m pytest --strict-config --strict-markers tests_cuda/test_cuda_release.py
