  github-release:
    name: Create the immutable GitHub release
    needs: [build, publish]
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      BOOTSTRAP_PIP_VERSION: "26.2.1"
    outputs:
      plan_artifact_id: ${{ steps.upload_plan.outputs.artifact-id }}
      plan_artifact_digest: ${{ steps.upload_plan.outputs.artifact-digest }}

    steps:
      - name: Stage an explicitly requested post-PyPI recovery drill
        if: inputs.stage_recovery_drill
        run: |
          echo "intentional recovery drill: PyPI succeeded; GitHub Release was not created" >&2
          exit 86

      - name: Check out the immutable release tag for final verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed immutable release source before candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "jemsbhai/explainiverse" || \
                "$GITHUB_REPOSITORY_OWNER" != "jemsbhai" || \
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" || \
                "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || \
                "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "normal GitHub Release source authority check failed" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          tag_object=$(git rev-parse "$RELEASE_TAG^{tag}")
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            --jq '.verification.verified')" = true
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Python 3.12 for provenance verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/release-tools.txt

      - name: Pin the provenance verifier installer
        run: python -m pip install --upgrade "pip==$BOOTSTRAP_PIP_VERSION"

      - name: Install the hash-locked provenance verifier
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement .github/requirements/release-tools.txt

      - name: Download and hard-verify the exact release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISTRIBUTIONS_ARTIFACT_ID: ${{ needs.build.outputs.distributions_artifact_id }}
          DISTRIBUTIONS_ARTIFACT_DIGEST: ${{ needs.build.outputs.distributions_artifact_digest }}
          PROVENANCE_ARTIFACT_ID: ${{ needs.build.outputs.provenance_artifact_id }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.provenance_artifact_digest }}
        run: |
          download_exact_artifact() {
            local label=$1
            local artifact_id=$2
            local artifact_digest=$3
            local destination=$4
            if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ || \
                  ! "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "$label artifact identity is malformed" >&2
              return 1
            fi
            local archive="$RUNNER_TEMP/$label-$artifact_id.zip"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$archive" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            local actual_digest
            actual_digest=$(sha256sum "$archive")
            actual_digest=${actual_digest%% *}
            test "$actual_digest" = "$artifact_digest"
            local entries
            entries=$(unzip -Z1 "$archive")
            test -n "$entries"
            if grep -Ev '^[A-Za-z0-9][A-Za-z0-9._+-]*$' <<< "$entries" | grep -q .; then
              echo "$label artifact contains an unsafe entry" >&2
              return 1
            fi
            test -z "$(sort <<< "$entries" | uniq -d)"
            mkdir "$destination"
            unzip -q "$archive" -d "$destination"
            rm "$archive"
          }
          download_exact_artifact provenance "$PROVENANCE_ARTIFACT_ID" \
            "$PROVENANCE_ARTIFACT_DIGEST" provenance
          download_exact_artifact distributions "$DISTRIBUTIONS_ARTIFACT_ID" \
            "$DISTRIBUTIONS_ARTIFACT_DIGEST" dist

      - name: Verify release assets against reviewed hashes and PyPI provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          (cd dist && sha256sum --check ../provenance/SHA256SUMS)
          version=${RELEASE_TAG#v}
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://pypi.org/pypi/explainiverse/$version/json" \
            --output pypi.json
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/verify_release_recovery.py artifacts \
            --sums provenance/SHA256SUMS \
            --dist dist \
            --pypi-json pypi.json \
            --project explainiverse \
            --tag "$RELEASE_TAG"
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/verify_pypi_provenance.py \
            --pypi-json pypi.json \
            --sums provenance/SHA256SUMS \
            --project explainiverse \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow publish-pypi.yml \
            --environment pypi \
            --output-dir pypi-provenance
          python -c "import importlib.metadata; print(importlib.metadata.version('pypi-attestations'))" \
            > pypi-provenance/pypi-attestations-version.txt
          test "$(cat pypi-provenance/pypi-attestations-version.txt)" = 0.0.30
          for artifact in dist/*; do
            filename=$(basename "$artifact")
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-pypi.yml@refs/tags/$RELEASE_TAG"
            pypi-attestations verify pypi \
              --repository "https://github.com/$GITHUB_REPOSITORY" \
              --provenance-file "pypi-provenance/$filename.provenance.json" \
              "$artifact" 2>&1 \
              | tee "pypi-provenance/$filename.cryptographic-verification.txt"
          done

      - name: Prepare the exact fixed-command GitHub Release plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p normal-release-plan/release-assets normal-release-plan/evidence
          for asset in dist/* provenance/*; do
            test -f "$asset"
            test ! -L "$asset"
            name=$(basename "$asset")
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
              echo "unsafe normal release asset name: $name" >&2
              exit 1
            fi
            if [[ -e "normal-release-plan/release-assets/$name" || \
                  -L "normal-release-plan/release-assets/$name" ]]; then
              echo "duplicate normal release asset name: $name" >&2
              exit 1
            fi
            install -m 0600 "$asset" "normal-release-plan/release-assets/$name"
          done
          (cd normal-release-plan/release-assets && sha256sum ./* | sort) \
            > normal-release-plan/release-assets.sha256
          (cd normal-release-plan/release-assets && \
            sha256sum --check ../release-assets.sha256 && \
            sha256sum --check SHA256SUMS)
          install -m 0600 pypi.json normal-release-plan/evidence/pypi.json
          cp -R pypi-provenance normal-release-plan/evidence/
          gh api --method GET "repos/$GITHUB_REPOSITORY/immutable-releases" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            > normal-release-plan/evidence/immutable-releases.json
          jq -e '.enabled == true' \
            normal-release-plan/evidence/immutable-releases.json > /dev/null

      - name: Archive the fixed normal-release plan
        id: upload_plan
        if: always() && inputs.stage_recovery_drill == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normal-release-plan-${{ inputs.tag }}
          path: normal-release-plan/
          if-no-files-found: error
          retention-days: 90

  github-release-finalize:
    name: Finalize the immutable GitHub release with fixed commands
    needs: [build, github-release]
    if: ${{ github.run_attempt == 1 && inputs.stage_recovery_drill == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Revalidate authority and the exact normal-release plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PLAN_ARTIFACT_ID: ${{ needs.github-release.outputs.plan_artifact_id }}
          PLAN_ARTIFACT_DIGEST: ${{ needs.github-release.outputs.plan_artifact_digest }}
          DISTRIBUTIONS_ARTIFACT_ID: ${{ needs.build.outputs.distributions_artifact_id }}
          DISTRIBUTIONS_ARTIFACT_DIGEST: ${{ needs.build.outputs.distributions_artifact_digest }}
          PROVENANCE_ARTIFACT_ID: ${{ needs.build.outputs.provenance_artifact_id }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.provenance_artifact_digest }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "jemsbhai/explainiverse" || \
                "$GITHUB_REPOSITORY_OWNER" != "jemsbhai" || \
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" || \
                "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || \
                "$GITHUB_RUN_ATTEMPT" != 1 || \
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ || \
                ! "$PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || \
                ! "$PLAN_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ || \
                ! "$DISTRIBUTIONS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || \
                ! "$DISTRIBUTIONS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ || \
                ! "$PROVENANCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ || \
                ! "$PROVENANCE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "fixed GitHub Release authority check failed" >&2
            exit 1
          fi

          download_bound_artifact() {
            local label=$1
            local artifact_id=$2
            local artifact_digest=$3
            local expected_name=$4
            local destination=$5
            local allow_directories=$6
            local metadata="$RUNNER_TEMP/$label-metadata.json"
            local archive="$RUNNER_TEMP/$label-$artifact_id.zip"

            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "$metadata"
            jq -e --argjson id "$artifact_id" --argjson run "$GITHUB_RUN_ID" \
              --arg head "$GITHUB_SHA" --arg name "$expected_name" \
              --arg digest "sha256:$artifact_digest" \
              '.id == $id and .name == $name and .expired == false and \
               .workflow_run.id == $run and .workflow_run.head_sha == $head and \
               .digest == $digest' "$metadata" > /dev/null
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$archive" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            local actual_digest
            actual_digest=$(sha256sum "$archive")
            actual_digest=${actual_digest%% *}
            test "$actual_digest" = "$artifact_digest"
            local entries
            entries=$(unzip -Z1 "$archive")
            test -n "$entries"
            test -z "$(sort <<< "$entries" | uniq -d)"
            while IFS= read -r entry; do
              if [[ "$allow_directories" == true ]]; then
                if [[ ! "$entry" =~ ^[A-Za-z0-9][A-Za-z0-9._+/-]*$ || \
                      "$entry" == *"//"* || "$entry" == *"/../"* || \
                      "$entry" == */.. || "$entry" == *"/./"* || \
                      "$entry" == */. ]]; then
                  echo "unsafe $label artifact entry: $entry" >&2
                  return 1
                fi
              elif [[ ! "$entry" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
                echo "$label artifact entry is not an exact flat filename: $entry" >&2
                return 1
              fi
            done <<< "$entries"
            mkdir "$destination"
            unzip -q "$archive" -d "$destination"
            rm "$archive"
          }

          download_bound_artifact plan "$PLAN_ARTIFACT_ID" \
            "$PLAN_ARTIFACT_DIGEST" "normal-release-plan-$RELEASE_TAG" \
            normal-release-plan true
          download_bound_artifact distributions "$DISTRIBUTIONS_ARTIFACT_ID" \
            "$DISTRIBUTIONS_ARTIFACT_DIGEST" release-distributions \
            finalize-source-dist false
          download_bound_artifact provenance "$PROVENANCE_ARTIFACT_ID" \
            "$PROVENANCE_ARTIFACT_DIGEST" release-provenance \
            finalize-source-provenance false

          version=${RELEASE_TAG#v}
          expected_distributions=$(printf '%s\n' \
            "explainiverse-$version-py3-none-any.whl" \
            "explainiverse-$version.tar.gz" | sort)
          actual_distributions=$(find finalize-source-dist -mindepth 1 \
            -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual_distributions" = "$expected_distributions"
          test -z "$(find finalize-source-dist -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)"

          expected_provenance=$(printf '%s\n' \
            RELEASE_GOVERNANCE.json \
            RELEASE_GOVERNANCE.md \
            SHA256SUMS \
            accepted-reproducibility-distributions.json \
            accepted-reproducibility-environment-comparison.json \
            accepted-reproducibility-environment-one.json \
            accepted-reproducibility-environment-two.json \
            admin-capture.json \
            admin-capture.json.sha256 \
            bound-reproducibility-distributions.json \
            bound-reproducibility-environment.json \
            cuda-evidence.sha256 \
            cuda-jobs.json \
            cuda-run.json \
            explainiverse-build.cdx.json \
            external-controls.json \
            external-controls.json.sha256 \
            preflight-source-run.json \
            publish-vs-reproducibility-one.json \
            publish-vs-reproducibility-two.json \
            release-environment.json \
            reproducibility-expected-run.json \
            reproducibility-source-run.json | sort)
          actual_provenance=$(find finalize-source-provenance -mindepth 1 \
            -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual_provenance" = "$expected_provenance"
          test -z "$(find finalize-source-provenance -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)"

          test -z "$(find normal-release-plan -mindepth 1 \
            ! -type f ! -type d -print -quit)"
          mkdir -p finalize-source/release-assets
          for asset in finalize-source-dist/* finalize-source-provenance/*; do
            test -f "$asset"
            test ! -L "$asset"
            name=$(basename "$asset")
            if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ || \
                  -e "finalize-source/release-assets/$name" || \
                  -L "finalize-source/release-assets/$name" ]]; then
              echo "unsafe or duplicate source release asset: $name" >&2
              exit 1
            fi
            install -m 0600 "$asset" "finalize-source/release-assets/$name"
          done
          (cd finalize-source/release-assets && sha256sum ./* | sort) \
            > finalize-source/release-assets.sha256
          cmp --silent normal-release-plan/release-assets.sha256 \
            finalize-source/release-assets.sha256
          (cd finalize-source/release-assets && \
            sha256sum --check ../release-assets.sha256 && \
            sha256sum --check SHA256SUMS)
          install -m 0600 normal-release-plan/release-assets.sha256 \
            normal-release-plan/evidence/verified-plan-release-assets.sha256
          install -m 0600 finalize-source/release-assets.sha256 \
            normal-release-plan/evidence/verified-source-release-assets.sha256

          install -m 0600 "$RUNNER_TEMP/plan-metadata.json" \
            normal-release-plan/evidence/verified-plan-artifact-metadata.json
          install -m 0600 "$RUNNER_TEMP/distributions-metadata.json" \
            normal-release-plan/evidence/verified-distributions-artifact-metadata.json
          install -m 0600 "$RUNNER_TEMP/provenance-metadata.json" \
            normal-release-plan/evidence/verified-provenance-artifact-metadata.json

      - name: Reverify immutable source, assets, attestations, and PyPI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > normal-release-plan/evidence/finalize-tag-ref.json
          jq -e '.object.type == "tag"' \
            normal-release-plan/evidence/finalize-tag-ref.json > /dev/null
          tag_object=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' \
            normal-release-plan/evidence/finalize-tag-ref.json)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            > normal-release-plan/evidence/finalize-tag-object.json
          jq -e '.verification.verified == true and .object.type == "commit"' \
            normal-release-plan/evidence/finalize-tag-object.json > /dev/null
          release_commit=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' \
            normal-release-plan/evidence/finalize-tag-object.json)
          test "$release_commit" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/compare/$release_commit...main" \
            > normal-release-plan/evidence/finalize-main-ancestry.json
          jq -e --arg commit "$release_commit" \
            '.base_commit.sha == $commit and .merge_base_commit.sha == $commit and \
             (.status == "ahead" or .status == "identical")' \
            normal-release-plan/evidence/finalize-main-ancestry.json > /dev/null
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$release_commit" \
            --arg repository "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" \
            --arg run "$GITHUB_RUN_ID" \
            '.schema_version == 1 and .release.repository == $repository and \
             .release.tag == $tag and .release.commit == $commit and \
              (.evidence.release_workflow_run_id | tostring) == $run and \
              .governance.release_dispatch_actor == $owner and \
              .governance.release_triggering_actor == $owner and \
              .governance.capture_principal == $owner and \
              (.governance.release_run_attempt | tostring) == "1"' \
            finalize-source/release-assets/RELEASE_GOVERNANCE.json > /dev/null

          test -f finalize-source/release-assets.sha256
          if grep -Ev '^[0-9a-f]{64}  \./[A-Za-z0-9][A-Za-z0-9._+-]*$' \
              finalize-source/release-assets.sha256 | grep -q .; then
            echo "source release asset manifest is malformed" >&2
            exit 1
          fi
          expected=$(sed -E 's/^[0-9a-f]{64}  //' \
            finalize-source/release-assets.sha256 | sort)
          actual=$(find finalize-source/release-assets -mindepth 1 -maxdepth 1 \
            -type f -printf './%f\n' | sort)
          test "$actual" = "$expected"
          (cd finalize-source/release-assets && \
            sha256sum --check ../release-assets.sha256 && \
            sha256sum --check SHA256SUMS)

          version=${RELEASE_TAG#v}
          expected_distributions=$(printf '%s\n' \
            "explainiverse-$version-py3-none-any.whl" \
            "explainiverse-$version.tar.gz" | sort)
          distribution_names=$(sed -E 's/^[0-9a-f]{64}  //' \
            finalize-source/release-assets/SHA256SUMS | sort)
          test "$distribution_names" = "$expected_distributions"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://pypi.org/pypi/explainiverse/$version/json" \
            --output normal-release-plan/evidence/pre-finalize-pypi.json
          test "$(jq -r '.info.name | ascii_downcase | gsub("-"; "_")' \
            normal-release-plan/evidence/pre-finalize-pypi.json)" = explainiverse
          test "$(jq -r '.info.version' \
            normal-release-plan/evidence/pre-finalize-pypi.json)" = "$version"
          actual_pypi=$(jq -r '.urls[] | "\(.digests.sha256)  \(.filename)"' \
            normal-release-plan/evidence/pre-finalize-pypi.json | sort)
          test "$actual_pypi" = "$(sort finalize-source/release-assets/SHA256SUMS)"
          while read -r _ filename; do
            gh attestation verify "finalize-source/release-assets/$filename" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish-pypi.yml@refs/tags/$RELEASE_TAG"
          done < finalize-source/release-assets/SHA256SUMS

      - name: Create, verify, and finalize the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          audit_live_source_and_authority() {
            if [[ "$GITHUB_REPOSITORY" != "jemsbhai/explainiverse" || \
                  "$GITHUB_REPOSITORY_OWNER" != "jemsbhai" || \
                  "$GITHUB_EVENT_NAME" != "workflow_dispatch" || \
                  "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                  "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" || \
                  "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || \
                  "$GITHUB_RUN_ATTEMPT" != 1 || \
                  ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "live release authority changed before a write" >&2
              return 1
            fi
            (cd finalize-source/release-assets && \
              sha256sum --check ../release-assets.sha256 && \
              sha256sum --check SHA256SUMS)
            cmp --silent normal-release-plan/release-assets.sha256 \
              finalize-source/release-assets.sha256

            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              > normal-release-plan/evidence/live-boundary-tag-ref.json
            jq -e '.object.type == "tag" and \
              (.object.sha | test("^[0-9a-f]{40}$"))' \
              normal-release-plan/evidence/live-boundary-tag-ref.json > /dev/null
            local tag_object
            tag_object=$(jq -er \
              '.object.sha | select(test("^[0-9a-f]{40}$"))' \
              normal-release-plan/evidence/live-boundary-tag-ref.json)
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
              > normal-release-plan/evidence/live-boundary-tag-object.json
            jq -e '.verification.verified == true and .object.type == "commit" and \
              (.object.sha | test("^[0-9a-f]{40}$"))' \
              normal-release-plan/evidence/live-boundary-tag-object.json > /dev/null
            local release_commit
            release_commit=$(jq -er \
              '.object.sha | select(test("^[0-9a-f]{40}$"))' \
              normal-release-plan/evidence/live-boundary-tag-object.json)
            test "$release_commit" = "$GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/compare/$release_commit...main" \
              > normal-release-plan/evidence/live-boundary-main-ancestry.json
            jq -e --arg commit "$release_commit" \
              '.base_commit.sha == $commit and .merge_base_commit.sha == $commit and \
               (.status == "ahead" or .status == "identical")' \
              normal-release-plan/evidence/live-boundary-main-ancestry.json > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/immutable-releases" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              > normal-release-plan/evidence/live-boundary-immutable-releases.json
            jq -e '.enabled == true' \
              normal-release-plan/evidence/live-boundary-immutable-releases.json > /dev/null

            local version=${RELEASE_TAG#v}
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "https://pypi.org/pypi/explainiverse/$version/json" \
              --output normal-release-plan/evidence/live-boundary-pypi.json
            test "$(jq -r '.info.name | ascii_downcase | gsub("-"; "_")' \
              normal-release-plan/evidence/live-boundary-pypi.json)" = explainiverse
            test "$(jq -r '.info.version' \
              normal-release-plan/evidence/live-boundary-pypi.json)" = "$version"
            local actual_pypi
            actual_pypi=$(jq -r '.urls[] | "\(.digests.sha256)  \(.filename)"' \
              normal-release-plan/evidence/live-boundary-pypi.json | sort)
            test "$actual_pypi" = "$(sort finalize-source/release-assets/SHA256SUMS)"
          }

          audit_draft_assets() {
            local uploaded_manifest=$1
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              > normal-release-plan/evidence/live-boundary-draft.json
            jq -e --arg tag "$RELEASE_TAG" \
              '.tag_name == $tag and .draft == true and .prerelease == false and \
               all(.assets[]; .state == "uploaded" and \
                   (.digest | test("^sha256:[0-9a-f]{64}$")))' \
              normal-release-plan/evidence/live-boundary-draft.json > /dev/null
            local expected_live actual_live
            expected_live=$(sed -E 's/^([0-9a-f]{64})  /sha256:\1  /' \
              "$uploaded_manifest" | sort)
            actual_live=$(jq -r \
              '.assets[] | "\(.digest)  ./\(.name)"' \
              normal-release-plan/evidence/live-boundary-draft.json | sort)
            test "$actual_live" = "$expected_live"
          }

          mkdir -p normal-release-plan/evidence/draft-assets
          uploaded_manifest="$RUNNER_TEMP/uploaded-release-assets.sha256"
          : > "$uploaded_manifest"

          audit_live_source_and_authority
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "normal release path refuses a pre-existing GitHub Release" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --notes-file finalize-source/release-assets/RELEASE_GOVERNANCE.md \
            --title "Explainiverse $RELEASE_TAG"

          audit_live_source_and_authority
          audit_draft_assets "$uploaded_manifest"
          disclosure=$(< finalize-source/release-assets/RELEASE_GOVERNANCE.md)
          body=$(jq -er '.body | select(type == "string")' \
            normal-release-plan/evidence/live-boundary-draft.json)
          if [[ -z "$disclosure" || "$body" != *"$disclosure"* ]]; then
            echo "draft GitHub Release omitted the governance disclosure" >&2
            exit 1
          fi

          while read -r expected_hash relative_name; do
            filename=${relative_name#./}
            test "$relative_name" = "./$filename"
            audit_live_source_and_authority
            audit_draft_assets "$uploaded_manifest"
            test "$(sha256sum "finalize-source/release-assets/$filename" | cut -d' ' -f1)" = \
              "$expected_hash"
            gh release upload "$RELEASE_TAG" \
              "finalize-source/release-assets/$filename" \
              --repo "$GITHUB_REPOSITORY"
            printf '%s  ./%s\n' "$expected_hash" "$filename" >> "$uploaded_manifest"
            sort -o "$uploaded_manifest" "$uploaded_manifest"
          done < finalize-source/release-assets.sha256

          audit_live_source_and_authority
          audit_draft_assets "$uploaded_manifest"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir normal-release-plan/evidence/draft-assets
          expected=$(sed -E 's/^[0-9a-f]{64}  //' \
            finalize-source/release-assets.sha256 | sort)
          actual=$(find normal-release-plan/evidence/draft-assets -mindepth 1 \
            -maxdepth 1 -type f -printf './%f\n' | sort)
          test "$actual" = "$expected"
          (cd normal-release-plan/evidence/draft-assets && \
            sha256sum --check ../../../finalize-source/release-assets.sha256)

          audit_live_source_and_authority
          audit_draft_assets "$uploaded_manifest"
          body=$(jq -er '.body | select(type == "string")' \
            normal-release-plan/evidence/live-boundary-draft.json)
          [[ -n "$disclosure" && "$body" == *"$disclosure"* ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Record the final immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            > normal-release-plan/evidence/final-release.json
          test "$(jq -r '.tag_name' normal-release-plan/evidence/final-release.json)" = \
            "$RELEASE_TAG"
          jq -e '.draft == false and .prerelease == false and .immutable == true' \
            normal-release-plan/evidence/final-release.json > /dev/null
          disclosure=$(< finalize-source/release-assets/RELEASE_GOVERNANCE.md)
          body=$(jq -er '.body | select(type == "string")' \
            normal-release-plan/evidence/final-release.json)
          if [[ -z "$disclosure" || "$body" != *"$disclosure"* ]]; then
            echo "final GitHub Release omitted the governance disclosure" >&2
            exit 1
          fi
          mkdir normal-release-plan/evidence/final-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir normal-release-plan/evidence/final-assets
          expected=$(sed -E 's/^[0-9a-f]{64}  //' \
            finalize-source/release-assets.sha256 | sort)
          actual=$(find normal-release-plan/evidence/final-assets -mindepth 1 \
            -maxdepth 1 -type f -printf './%f\n' | sort)
          test "$actual" = "$expected"
          (cd normal-release-plan/evidence/final-assets && \
            sha256sum --check ../../../finalize-source/release-assets.sha256)
          (cd normal-release-plan/evidence/final-assets && sha256sum ./* | sort) \
            > normal-release-plan/evidence/final-assets.sha256

      - name: Archive normal-path release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normal-release-verification-${{ inputs.tag }}
          path: normal-release-plan/evidence/
          if-no-files-found: error
          retention-days: 90
