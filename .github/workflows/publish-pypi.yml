name: Publish verified and attested Python distributions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag selected as both workflow ref and input (for example v0.15.0)"
        required: true
        type: string
      preflight_run_id:
        description: "Successful pre-tag release-preflight workflow run ID"
        required: true
        type: string
      cuda_run_id:
        description: "Exact CUDA evidence run attested by release-preflight"
        required: true
        type: string
      single_minimum_runner_nonce:
        description: "16-hex binding for the minimum release CUDA custom runner"
        required: true
        type: string
      single_latest_runner_nonce:
        description: "16-hex binding for the latest release CUDA custom runner"
        required: true
        type: string
      stage_recovery_drill:
        description: "Intentionally stop after PyPI so the recovery-only workflow can be drilled"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify the attested pre-tag external-control snapshot
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Require an exact first-attempt owner tag publication
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          STAGE_RECOVERY_DRILL: ${{ inputs.stage_recovery_drill }}
          SINGLE_MINIMUM_RUNNER_NONCE: ${{ inputs.single_minimum_runner_nonce }}
          SINGLE_LATEST_RUNNER_NONCE: ${{ inputs.single_latest_runner_nonce }}
        run: |
          python3 - <<'PY'
          import os
          import re

          repository = os.environ.get("GITHUB_REPOSITORY")
          repository_owner = os.environ.get("GITHUB_REPOSITORY_OWNER")
          actor = os.environ.get("GITHUB_ACTOR")
          triggering_actor = os.environ.get("GITHUB_TRIGGERING_ACTOR")
          event_name = os.environ.get("GITHUB_EVENT_NAME")
          ref = os.environ.get("GITHUB_REF")
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT")
          release_tag = os.environ.get("RELEASE_TAG")
          stage_recovery_drill = os.environ.get("STAGE_RECOVERY_DRILL")
          runner_nonces = (
              os.environ.get("SINGLE_MINIMUM_RUNNER_NONCE"),
              os.environ.get("SINGLE_LATEST_RUNNER_NONCE"),
          )

          trusted_repository = (
              repository == "jemsbhai/explainiverse"
              and repository_owner == "jemsbhai"
          )
          trusted_trigger = (
              actor == repository_owner
              and triggering_actor == repository_owner
          )
          valid_tag = (
              isinstance(release_tag, str)
              and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", release_tag) is not None
          )
          exact_tag_ref = valid_tag and ref == f"refs/tags/{release_tag}"
          exact_nonces = all(
              isinstance(value, str)
              and re.fullmatch(r"[a-f0-9]{16}", value) is not None
              for value in runner_nonces
          )
          distinct_nonces = len(set(runner_nonces)) == len(runner_nonces)
          if not (
              trusted_repository
              and trusted_trigger
              and event_name == "workflow_dispatch"
              and run_attempt == "1"
              and exact_tag_ref
              and exact_nonces
              and distinct_nonces
          ):
              raise SystemExit(
                  "publication preflight requires an owner-triggered first attempt "
                  "dispatched from the exact stable tag"
              )
          if release_tag == "v0.15.0" and stage_recovery_drill != "true":
              raise SystemExit(
                  "publication preflight requires stage_recovery_drill=true for v0.15.0"
              )
          PY

      - name: Validate preflight run input
        env:
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
        run: |
          if [[ ! "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "preflight_run_id must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$CUDA_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "cuda_run_id must be a positive integer" >&2
            exit 1
          fi

      - name: Check out the immutable release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the signed immutable release source before external work
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          checkout_sha=$(git rev-parse HEAD)
          if [[ "$checkout_sha" != "$GITHUB_SHA" ]]; then
            echo "checked-out release commit differs from GITHUB_SHA" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$RELEASE_TAG")" != tag ]]; then
            echo "release ref must resolve to an annotated tag object" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$checkout_sha" ]]; then
            echo "annotated release tag must peel to the checked-out commit" >&2
            exit 1
          fi
          tag_object=$(git rev-parse "$RELEASE_TAG^{tag}")
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" != true ]]; then
            echo "annotated release tag must have GitHub-verified signature evidence" >&2
            exit 1
          fi
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release commit must be an ancestor of current origin/main" >&2
            exit 1
          fi
          release_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)
          if [[ "$release_version" != "${RELEASE_TAG#v}" ]]; then
            echo "release tag and pyproject version differ" >&2
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download and bind the preflight run and attested snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          SINGLE_MINIMUM_RUNNER_NONCE: ${{ inputs.single_minimum_runner_nonce }}
          SINGLE_LATEST_RUNNER_NONCE: ${{ inputs.single_latest_runner_nonce }}
        run: |
          mkdir -p release-preflight
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID" \
            > release-preflight/source-run.json
          gh run download "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-control-preflight --dir release-preflight/artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID" \
            > release-preflight/live-cuda-run.json
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CUDA_RUN_ID/jobs?filter=all&per_page=100" \
            --jq '.jobs[]' \
            | jq -s \
              '{query_filter:"all",pagination_complete:true,jobs:.}' \
              > release-preflight/live-cuda-jobs.json
          (cd release-preflight/artifact && sha256sum --check external-controls.json.sha256)
          gh attestation verify release-preflight/artifact/external-controls.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-preflight.yml@refs/heads/main"
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/release_external_controls.py verify \
            --policy .github/release-control-policy.json \
            --snapshot release-preflight/artifact/external-controls.json \
            --run-json release-preflight/source-run.json \
            --run-id "$PREFLIGHT_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --cuda-run-json release-preflight/live-cuda-run.json \
            --cuda-jobs-json release-preflight/live-cuda-jobs.json \
            --cuda-run-id "$CUDA_RUN_ID"
          env -u GH_TOKEN -u GITHUB_TOKEN python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          jobs = json.loads(
              Path("release-preflight/live-cuda-jobs.json").read_text(encoding="utf-8")
          )["jobs"]
          evidence_nonces = set()
          pattern = re.compile(r"^explainiverse-cuda-(?:single|two)-jit-([a-f0-9]{16})$")
          for job in jobs:
              if job.get("name", "").startswith("CUDA "):
                  match = pattern.fullmatch(str(job.get("runner_name", "")))
                  if match is None:
                      raise SystemExit("accepted CUDA job has no exact nonce-bound runner name")
                  evidence_nonces.add(match.group(1))
          release_nonces = {
              os.environ["SINGLE_MINIMUM_RUNNER_NONCE"],
              os.environ["SINGLE_LATEST_RUNNER_NONCE"],
          }
          overlap = evidence_nonces & release_nonces
          if overlap:
              raise SystemExit(f"release runner nonces reuse CUDA evidence nonces: {sorted(overlap)!r}")
          PY

      - name: Fail before build if PyPI already contains the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/check_pypi_version_absent.py
          --project explainiverse
          --tag "$RELEASE_TAG"

  cuda-release:
    name: Release CUDA single-GPU (Torch ${{ matrix.torch-edge }}, zero skips)
    needs: preflight
    if: ${{ github.run_attempt == 1 }}
    runs-on: ${{ format('explainiverse-cuda-single-jit-{0}', matrix.runner_nonce) }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-edge: minimum
            python-version: "3.10"
            constraints: .github/constraints/captum-min.txt
            runner_nonce: ${{ inputs.single_minimum_runner_nonce }}
          - torch-edge: latest
            python-version: "3.12"
            constraints: none
            runner_nonce: ${{ inputs.single_latest_runner_nonce }}
    env:
      EXPLAINIVERSE_REQUIRED_CUDA_DEVICES: "1"
      EXPLAINIVERSE_ENFORCE_CUDA_MANIFEST: "1"
      CUDA_VISIBLE_DEVICES: "0"

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Require Linux GPU runner OS
        run: test "$RUNNER_OS" = Linux

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/captum-min.txt

      - name: Install the supported Torch edge
        env:
          CONSTRAINTS: ${{ matrix.constraints }}
        run: |
          python -m pip install --upgrade pip
          constraint_args=()
          if [[ "$CONSTRAINTS" != none ]]; then
            constraint_args=(--constraint "$CONSTRAINTS")
          fi
          python -m pip install --upgrade --upgrade-strategy eager \
            "${constraint_args[@]}" --editable ".[all]" "pytest>=8,<9"
          python -m pip check

      - name: Prove real CUDA hardware
        run: |
          nvidia-smi
          python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0)); assert torch.cuda.is_available(); assert torch.cuda.device_count() == 1"

      - name: Run the CUDA release suite with zero skips
        run: python -m pytest --strict-config --strict-markers tests_cuda/test_cuda_release.py

  build:
    name: Verify, build once, and inventory
    needs: [preflight, cuda-release]
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      BOOTSTRAP_PIP_VERSION: "26.2.1"
    outputs:
      distributions_artifact_id: ${{ steps.upload_distributions.outputs.artifact-id }}
      distributions_artifact_digest: ${{ steps.upload_distributions.outputs.artifact-digest }}
      provenance_artifact_id: ${{ steps.upload_provenance.outputs.artifact-id }}
      provenance_artifact_digest: ${{ steps.upload_provenance.outputs.artifact-digest }}

    steps:
      - name: Validate requested tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Check out the immutable release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/requirements/release-tools.txt
            poetry.lock

      - name: Verify tag, main ancestry, and package version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN python scripts/validate_release_attestation_context.py
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          tag_object=$(git rev-parse "$RELEASE_TAG^{tag}")
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag version {expected!r} != pyproject version {version!r}")
          PY

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.11.0"
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - name: Pin and record the bootstrap installer
        run: |
          python -m pip install --upgrade "pip==$BOOTSTRAP_PIP_VERSION"
          python -m pip --version

      - name: Install the hash-locked Linux release-tool graph
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --requirement .github/requirements/release-tools.txt

      - name: Install the exact locked Python release environment
        run: poetry sync --all-extras --with dev,tutorial --no-interaction

      - name: Run the complete Python release gate
        run: |
          poetry check --lock
          poetry run python -m pip check
          poetry run black --check src tests scripts
          poetry run isort --check-only src tests scripts
          poetry run mypy src scripts
          poetry run python -m pytest --strict-config --strict-markers
          poetry run python scripts/execute_tutorials.py

      - name: Run the complete experimental JavaScript gate
        working-directory: packages/js
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm run build:demo
          npm run check:package-boundary

      - name: Refuse release inputs created by candidate-authored gates
        run: |
          for path in release-source release-governance reproducibility-proof provenance dist; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "candidate gates created reserved release path: $path" >&2
              exit 1
            fi
          done

      - name: Check out a clean release source after all candidate-authored gates
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
          path: release-source

      - name: Reverify the clean signed release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -z "$(git -C release-source status --porcelain --untracked-files=all)"
          (
            cd release-source
            env -u GH_TOKEN -u GITHUB_TOKEN python scripts/validate_release_attestation_context.py
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
            tag_object=$(git rev-parse "$RELEASE_TAG^{tag}")
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git merge-base --is-ancestor HEAD origin/main
          )

      - name: Recreate governance and bind the accepted reproducibility artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CUDA_RUN_ID: ${{ inputs.cuda_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir release-governance reproducibility-proof provenance
          gh run download "$PREFLIGHT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-control-preflight --dir release-governance
          (cd release-governance && \
            sha256sum --check admin-capture.json.sha256 && \
            sha256sum --check cuda-evidence.sha256 && \
            sha256sum --check external-controls.json.sha256)
          for evidence in \
            admin-capture.json admin-capture.json.sha256 \
            cuda-run.json cuda-jobs.json cuda-evidence.sha256 \
            external-controls.json external-controls.json.sha256; do
            gh attestation verify "release-governance/$evidence" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-preflight.yml@refs/heads/main"
          done
          cp release-governance/* provenance/
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN_ID" \
            > provenance/preflight-source-run.json
          env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/create_release_governance_record.py \
            --policy release-source/.github/release-control-policy.json \
            --snapshot provenance/external-controls.json \
            --output-json provenance/RELEASE_GOVERNANCE.json \
            --output-markdown provenance/RELEASE_GOVERNANCE.md \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$(git -C release-source rev-parse HEAD)" \
            --preflight-run-id "$PREFLIGHT_RUN_ID" \
            --cuda-run-id "$CUDA_RUN_ID" \
            --release-run-id "$GITHUB_RUN_ID" \
            --release-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-actor "$GITHUB_ACTOR" \
            --release-triggering-actor "$GITHUB_TRIGGERING_ACTOR"
          (
            cd release-source
            env -u GH_TOKEN -u GITHUB_TOKEN python scripts/record_release_environment.py \
              --requirements .github/requirements/release-tools.txt \
              --output "$GITHUB_WORKSPACE/provenance/release-environment.json"
          )
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(
              Path("provenance/external-controls.json").read_text(encoding="utf-8")
          )
          matches = [
              check
              for check in snapshot["observation"]["check_runs"]
              if check.get("name") == "Artifact byte reproducibility"
          ]
          if len(matches) != 1:
              raise SystemExit("expected exactly one Artifact byte reproducibility check")
          expected_run = matches[0].get("workflow_run")
          if not isinstance(expected_run, dict):
              raise SystemExit("reproducibility check has no normalized Actions run")
          expected_fields = {
              "id",
              "repository",
              "path",
              "event",
              "head_branch",
              "head_sha",
              "status",
              "conclusion",
              "run_attempt",
          }
          if set(expected_run) != expected_fields:
              raise SystemExit(
                  "reproducibility check run fields differ from the reviewed schema: "
                  f"expected {sorted(expected_fields)!r}, got {sorted(expected_run)!r}"
              )
          run_id = expected_run.get("id")
          if isinstance(run_id, bool) or not isinstance(run_id, int) or run_id < 1:
              raise SystemExit("reproducibility check has no valid Actions run ID")
          Path("provenance/reproducibility-expected-run.json").write_text(
              json.dumps(expected_run, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          reproducibility_run_id=$(
            jq -er '.id | select(type == "number" and . >= 1) | tostring' \
              provenance/reproducibility-expected-run.json
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$reproducibility_run_id" \
            > provenance/reproducibility-source-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(
              Path("provenance/reproducibility-expected-run.json").read_text(encoding="utf-8")
          )
          actual = json.loads(
              Path("provenance/reproducibility-source-run.json").read_text(encoding="utf-8")
          )
          repository = actual.get("repository")
          actual_normalized = {
              "id": actual.get("id"),
              "repository": (
                  repository.get("full_name") if isinstance(repository, dict) else None
              ),
              "path": actual.get("path"),
              "event": actual.get("event"),
              "head_branch": actual.get("head_branch"),
              "head_sha": actual.get("head_sha"),
              "status": actual.get("status"),
              "conclusion": actual.get("conclusion"),
              "run_attempt": actual.get("run_attempt"),
          }
          if actual_normalized != expected:
              differences = {
                  field: {"expected": expected.get(field), "actual": actual_normalized.get(field)}
                  for field in sorted(expected)
                  if expected.get(field) != actual_normalized.get(field)
              }
              raise SystemExit(
                  "live reproducibility run differs from the attested check run: "
                  + json.dumps(differences, sort_keys=True)
              )
          PY
          reproducibility_run_attempt=$(
            jq -er '.run_attempt | select(type == "number" and . >= 1) | tostring' \
              provenance/reproducibility-source-run.json
          )
          gh run download "$reproducibility_run_id" --repo "$GITHUB_REPOSITORY" \
            --name reproducibility-one --dir reproducibility-proof/one
          gh run download "$reproducibility_run_id" --repo "$GITHUB_REPOSITORY" \
            --name reproducibility-two --dir reproducibility-proof/two
          gh run download "$reproducibility_run_id" --repo "$GITHUB_REPOSITORY" \
            --name reproducibility-report --dir reproducibility-proof/report
          env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/record_release_environment.py \
            --compare \
              reproducibility-proof/one/provenance/release-environment.json \
              reproducibility-proof/two/provenance/release-environment.json \
            --expected-run-id "$reproducibility_run_id" \
            --expected-run-attempt "$reproducibility_run_attempt" \
            --output provenance/bound-reproducibility-environment.json
          env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/compare_distribution_artifacts.py \
            reproducibility-proof/one/dist reproducibility-proof/two/dist \
            --report provenance/bound-reproducibility-distributions.json
          test "$(find reproducibility-proof/report -mindepth 1 | wc -l)" -eq 4
          for report in \
            release-environment-one.json \
            release-environment-two.json \
            release-environment-comparison.json \
            reproducibility.json; do
            test -f "reproducibility-proof/report/$report"
            test ! -L "reproducibility-proof/report/$report"
          done
          cmp reproducibility-proof/report/release-environment-one.json \
            reproducibility-proof/one/provenance/release-environment.json
          cmp reproducibility-proof/report/release-environment-two.json \
            reproducibility-proof/two/provenance/release-environment.json
          cmp reproducibility-proof/report/release-environment-comparison.json \
            provenance/bound-reproducibility-environment.json
          cmp reproducibility-proof/report/reproducibility.json \
            provenance/bound-reproducibility-distributions.json
          cp reproducibility-proof/report/release-environment-one.json \
            provenance/accepted-reproducibility-environment-one.json
          cp reproducibility-proof/report/release-environment-two.json \
            provenance/accepted-reproducibility-environment-two.json
          cp reproducibility-proof/report/release-environment-comparison.json \
            provenance/accepted-reproducibility-environment-comparison.json
          cp reproducibility-proof/report/reproducibility.json \
            provenance/accepted-reproducibility-distributions.json

      - name: Build once from the clean release checkout and match both proof builds
        run: |
          test -z "$(git -C release-source status --porcelain --untracked-files=all)"
          SOURCE_DATE_EPOCH="$(git -C release-source log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export PYTHONHASHSEED=0
          (cd release-source && poetry build --output "$GITHUB_WORKSPACE/dist")
          python -m twine check ./dist/*
          for artifact in dist/*.whl dist/*.tar.gz; do
            env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/audit_typing_readiness.py \
              --policy release-source/.github/typing-readiness-policy.json \
              --project-file release-source/pyproject.toml \
              --repository-root release-source \
              --distribution "$artifact"
          done
          env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/compare_distribution_artifacts.py \
            dist reproducibility-proof/one/dist \
            --report provenance/publish-vs-reproducibility-one.json
          env -u GH_TOKEN -u GITHUB_TOKEN python release-source/scripts/compare_distribution_artifacts.py \
            dist reproducibility-proof/two/dist \
            --report provenance/publish-vs-reproducibility-two.json

      - name: Generate hashes and reproducible build-environment SBOM
        run: |
          mkdir -p provenance
          (cd dist && sha256sum -- *.whl *.tar.gz) > provenance/SHA256SUMS
          (cd dist && sha256sum --check ../provenance/SHA256SUMS)
          poetry_python=$(poetry env info --executable)
          cyclonedx-py environment "$poetry_python" \
            --pyproject release-source/pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file provenance/explainiverse-build.cdx.json

      - name: Upload immutable distributions
        id: upload_distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload hashes and SBOM
        id: upload_provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance
          path: provenance/*
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest the immutable distributions
    needs: build
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download and hard-verify the exact build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISTRIBUTIONS_ARTIFACT_ID: ${{ needs.build.outputs.distributions_artifact_id }}
          DISTRIBUTIONS_ARTIFACT_DIGEST: ${{ needs.build.outputs.distributions_artifact_digest }}
          PROVENANCE_ARTIFACT_ID: ${{ needs.build.outputs.provenance_artifact_id }}
          PROVENANCE_ARTIFACT_DIGEST: ${{ needs.build.outputs.provenance_artifact_digest }}
        run: |
          download_exact_artifact() {
            local label=$1
            local artifact_id=$2
            local artifact_digest=$3
            local expected_name=$4
            local destination=$5
            if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ || \
                  ! "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "$label artifact identity is malformed" >&2
              return 1
            fi
            local metadata="$RUNNER_TEMP/$label-metadata.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              > "$metadata"
            jq -e --argjson id "$artifact_id" --argjson run "$GITHUB_RUN_ID" \
              --arg head "$GITHUB_SHA" --arg name "$expected_name" \
              --arg digest "sha256:$artifact_digest" \
              '.id == $id and .name == $name and .expired == false and \
               .workflow_run.id == $run and .workflow_run.head_sha == $head and \
               .digest == $digest' "$metadata" > /dev/null
            local archive="$RUNNER_TEMP/$label-$artifact_id.zip"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$archive" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            local actual_digest
            actual_digest=$(sha256sum "$archive")
            actual_digest=${actual_digest%% *}
            test "$actual_digest" = "$artifact_digest"
            local entries
            entries=$(unzip -Z1 "$archive")
            test -n "$entries"
            if grep -Ev '^[A-Za-z0-9][A-Za-z0-9._+-]*$' <<< "$entries" | grep -q .; then
              echo "$label artifact contains an unsafe entry" >&2
              return 1
            fi
            test -z "$(sort <<< "$entries" | uniq -d)"
            mkdir "$destination"
            unzip -q "$archive" -d "$destination"
            rm "$archive"
          }

          download_exact_artifact provenance "$PROVENANCE_ARTIFACT_ID" \
            "$PROVENANCE_ARTIFACT_DIGEST" release-provenance provenance
          download_exact_artifact distributions "$DISTRIBUTIONS_ARTIFACT_ID" \
            "$DISTRIBUTIONS_ARTIFACT_DIGEST" release-distributions dist

          expected_provenance=$(printf '%s\n' \
            RELEASE_GOVERNANCE.json \
            RELEASE_GOVERNANCE.md \
            SHA256SUMS \
            accepted-reproducibility-distributions.json \
            accepted-reproducibility-environment-comparison.json \
            accepted-reproducibility-environment-one.json \
            accepted-reproducibility-environment-two.json \
            admin-capture.json \
            admin-capture.json.sha256 \
            bound-reproducibility-distributions.json \
            bound-reproducibility-environment.json \
            cuda-evidence.sha256 \
            cuda-jobs.json \
            cuda-run.json \
            explainiverse-build.cdx.json \
            external-controls.json \
            external-controls.json.sha256 \
            preflight-source-run.json \
            publish-vs-reproducibility-one.json \
            publish-vs-reproducibility-two.json \
            release-environment.json \
            reproducibility-expected-run.json \
            reproducibility-source-run.json | sort)
          actual_provenance=$(find provenance -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | sort)
          test "$actual_provenance" = "$expected_provenance"
          test -z "$(find provenance -mindepth 1 -maxdepth 1 \
            ! -type f -print -quit)"

          version=${RELEASE_TAG#v}
          expected=$(printf '%s\n' \
            "explainiverse-$version-py3-none-any.whl" \
            "explainiverse-$version.tar.gz" | sort)
          if grep -Ev '^[0-9a-f]{64}  [A-Za-z0-9][A-Za-z0-9._+-]*$' \
              provenance/SHA256SUMS | grep -q .; then
            echo "distribution hash manifest is malformed" >&2
            exit 1
          fi
          manifest_names=$(sed -E 's/^[0-9a-f]{64}  //' provenance/SHA256SUMS | sort)
          actual=$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$manifest_names" = "$expected"
          test "$actual" = "$expected"
          test -z "$(find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          (cd dist && sha256sum --check ../provenance/SHA256SUMS)

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
