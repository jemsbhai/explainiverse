               .workflow_run.id == $run and .workflow_run.head_sha == $head and \
               .digest == $digest' "$metadata" > /dev/null
            local archive="$RUNNER_TEMP/$label-$artifact_id.zip"
            curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$archive" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            local actual_digest
            actual_digest=$(sha256sum "$archive")
            actual_digest=${actual_digest%% *}
            test "$actual_digest" = "$artifact_digest"
            local entries
            entries=$(unzip -Z1 "$archive")
            test -n "$entries"
            if grep -Ev '^[A-Za-z0-9][A-Za-z0-9._+-]*$' <<< "$entries" | grep -q .; then
              echo "$label artifact contains an unsafe entry" >&2
              return 1
            fi
            test -z "$(sort <<< "$entries" | uniq -d)"
            mkdir "$destination"
            unzip -q "$archive" -d "$destination"
            rm "$archive"
          }

          download_exact_artifact provenance "$PROVENANCE_ARTIFACT_ID" \
            "$PROVENANCE_ARTIFACT_DIGEST" release-provenance provenance
          download_exact_artifact distributions "$DISTRIBUTIONS_ARTIFACT_ID" \
            "$DISTRIBUTIONS_ARTIFACT_DIGEST" release-distributions dist

          expected_provenance=$(printf '%s\n' \
            RELEASE_GOVERNANCE.json \
            RELEASE_GOVERNANCE.md \
            SHA256SUMS \
            accepted-reproducibility-distributions.json \
            accepted-reproducibility-environment-comparison.json \
            accepted-reproducibility-environment-one.json \
            accepted-reproducibility-environment-two.json \
            admin-capture.json \
            admin-capture.json.sha256 \
            bound-reproducibility-distributions.json \
            bound-reproducibility-environment.json \
            cuda-evidence.sha256 \
            cuda-jobs.json \
            cuda-run.json \
            explainiverse-build.cdx.json \
            external-controls.json \
            external-controls.json.sha256 \
            preflight-source-run.json \
            publish-vs-reproducibility-one.json \
            publish-vs-reproducibility-two.json \
            release-environment.json \
            reproducibility-expected-run.json \
            reproducibility-source-run.json | sort)
          actual_provenance=$(find provenance -mindepth 1 -maxdepth 1 \
            -type f -printf '%f\n' | sort)
          test "$actual_provenance" = "$expected_provenance"
          test -z "$(find provenance -mindepth 1 -maxdepth 1 \
